<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ราคาทองคำ</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(160deg, #7a0000 0%, #b00000 50%, #8b0000 100%);
      color: #fff;
      font-family: 'Sarabun', 'Segoe UI', sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* ── Top half: price dashboard ── */
    .dashboard-top {
      flex: 0 0 50%;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 14px 8px;
      overflow-y: auto;
    }

    /* ── Bottom half: image slideshow ── */
    .slideshow {
      flex: 0 0 50%;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 1;
      transition: opacity 0.8s ease;
    }

    /* ── Shop name banner ── */
    .shop-banner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6vh;
      margin-bottom: 1vh;
      padding-bottom: 1vh;
      border-bottom: 1px solid rgba(245, 200, 66, 0.4);
    }

    .shop-logo {
      position: absolute;
      top: 6px;
      left: 10px;
      height: 6vh;
      width: 6vh;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
    }

    .shop-name {
      font-size: 2.8vh;
      font-weight: 800;
      color: #f5c842;
      letter-spacing: 1px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
      text-align: center;
    }

    /* ── Header ── */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0.3vh;
      margin-bottom: 1vh;
    }

    .header-left .brand {
      font-size: 2.5vh;
      font-weight: 700;
      color: #f5c842;
      letter-spacing: 0.5px;
    }

    .header-left .sub {
      font-size: 1.3vh;
      color: #999;
      margin-top: 1px;
    }

    /* ── Cards ── */
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5vh;
    }

    .card {
      background: rgba(0, 0, 0, 0.40);
      border: 1px solid rgba(245, 200, 66, 0.25);
      border-radius: 1.2vh;
      padding: 1.5vh 1.8vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, #f5c842, #e8a020);
      border-radius: 1.2vh 1.2vh 0 0;
    }

    .card-icon {
      font-size: 2.6vh;
      margin-bottom: 0.3vh;
    }

    .card-title {
      font-size: 2.3vh;
      font-weight: 700;
      color: #f5c842;
      margin-bottom: 1vh;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 1vh 0;
    }

    .price-row + .price-row {
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .price-label {
      font-size: 2vh;
      color: rgba(255,255,255,0.65);
      font-weight: 400;
    }

    .price-value {
      font-size: 3.7vh;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .price-unit {
      font-size: 1.4vh;
      font-weight: 400;
      color: inherit;
      opacity: 0.6;
      margin-left: 4px;
    }

    .buy  { color: #4ade80; }
    .sell { color: #f87171; }

    .loading .price-value { color: rgba(255,255,255,0.2); }

    /* ── Footer ── */
    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3vh;
      margin-top: 1vh;
      padding-top: 1vh;
      border-top: 1px solid rgba(245, 200, 66, 0.25);
      color: rgba(255,255,255,0.45);
      font-size: 1.6vh;
      text-align: center;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 1.1vh;
      height: 1.1vh;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2.5s ease-in-out infinite;
    }

    .live-dot.error { background: #f87171; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    #update-info { color: rgba(255,255,255,0.5); }

    .refresh-countdown {
      font-size: 1.3vh;
      color: rgba(255,255,255,0.35);
    }

    /* ── Fade animation on data refresh ── */
    .flash { animation: flash 0.6s ease-out; }
    @keyframes flash {
      0%   { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* ── Confetti ── */
    .confetti-piece {
      position: absolute;
      top: 0;
      pointer-events: none;
      z-index: 50;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-5px) rotate(0deg); opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateY(200px) rotate(560deg); opacity: 0; }
    }

    /* ── Prize card reveal ── */
    .prize-result.show {
      animation: prizeReveal 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }
    @keyframes prizeReveal {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.07); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ── Full-screen prize reveal ── */
    .prize-reveal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(0,0,0,0.93);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }
    .prize-reveal-overlay.open { display: flex; }

    .prize-reveal-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.2vh;
      padding: 3vh 4vw;
      animation: prizeRevealFull 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
      pointer-events: none;
    }
    @keyframes prizeRevealFull {
      0%   { transform: scale(0.25) rotate(-8deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .prize-reveal-congrats {
      font-size: 5vh;
      font-weight: 800;
      color: #f5c842;
      text-shadow: 0 0 30px rgba(245,200,66,0.9), 0 2px 8px rgba(0,0,0,0.8);
      text-align: center;
      font-family: 'Sarabun', sans-serif;
    }

    .prize-reveal-img {
      max-height: 42vh;
      max-width: 86vw;
      object-fit: contain;
      border-radius: 2.5vh;
      box-shadow: 0 8px 50px rgba(0,0,0,0.7), 0 0 0 3px rgba(245,200,66,0.5);
    }

    .prize-reveal-name {
      font-size: 4.5vh;
      font-weight: 800;
      color: #fff;
      text-align: center;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
      font-family: 'Sarabun', sans-serif;
    }

    .prize-reveal-value {
      font-size: 2.8vh;
      font-weight: 600;
      color: #f5c842;
      font-family: 'Sarabun', sans-serif;
    }

    .prize-reveal-hint {
      font-size: 1.8vh;
      color: rgba(255,255,255,0.35);
      margin-top: 1vh;
      font-family: 'Sarabun', sans-serif;
      animation: hintBlink 1.8s ease-in-out infinite;
    }
    @keyframes hintBlink {
      0%,100% { opacity: 0.35; }
      50%      { opacity: 0.75; }
    }

    /* ── Mini-game button ── */
    .minigame-btn {
      position: absolute;
      bottom: 3vh;
      right: 12px;
      z-index: 10;
      background: rgba(245, 200, 66, 0.92);
      color: #7a0000;
      border: none;
      border-radius: 50%;
      width: 5.5vh;
      height: 5.5vh;
      font-size: 2.8vh;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 14px rgba(0,0,0,0.55);
      transition: transform 0.2s;
      font-family: 'Sarabun', sans-serif;
    }
    .minigame-btn:hover { transform: scale(1.15) rotate(20deg); }

    /* ── Game overlay (covers slideshow area) ── */
    .game-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(0,0,0,0.88);
      align-items: center;
      justify-content: center;
    }
    .game-overlay.open { display: flex; }

    .game-panel {
      background: linear-gradient(160deg, #6a0000 0%, #a00000 100%);
      border: 2px solid #f5c842;
      border-radius: 2vh;
      padding: 1.5vh 1.8vh 1.8vh;
      width: 92%;
      max-height: 96%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1vh;
      position: relative;
    }

    .game-title {
      color: #f5c842;
      font-size: 2.6vh;
      font-weight: 800;
      text-align: center;
      letter-spacing: 1px;
    }

    .close-game-btn {
      position: absolute;
      top: 0.8vh;
      right: 1.2vh;
      background: none;
      border: none;
      color: rgba(255,255,255,0.55);
      font-size: 2.2vh;
      cursor: pointer;
      line-height: 1;
    }
    .close-game-btn:hover { color: #fff; }

    /* ── Slot Machine ── */
    .slot-reels {
      display: flex;
      gap: 0.8vh;
      border: 3px solid #f5c842;
      border-radius: 1.5vh;
      background: #080808;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 24px rgba(245,200,66,0.25), inset 0 0 30px rgba(0,0,0,0.9);
      width: 100%;
    }

    /* Win-line bars */
    .slot-reels::before,
    .slot-reels::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: rgba(245,200,66,0.75);
      z-index: 10;
      pointer-events: none;
    }
    .slot-reels::before { top: calc(9vh);      }
    .slot-reels::after  { top: calc(18vh - 2px); }

    /* Near-miss flash */
    @keyframes slotFlash {
      0%,100% { box-shadow: 0 0 24px rgba(245,200,66,0.25), inset 0 0 30px rgba(0,0,0,0.9); border-color: #f5c842; }
      50%     { box-shadow: 0 0 60px rgba(245,200,66,1), 0 0 0 5px #f5c842, inset 0 0 10px rgba(255,200,0,0.2); border-color: #fff; }
    }
    .slot-reels.slot-flash { animation: slotFlash 0.25s ease-in-out 3; }

    /* Shake on near-miss */
    @keyframes slotShake {
      0%,100% { transform: translateX(0); }
      20%  { transform: translateX(-4px); }
      40%  { transform: translateX(4px); }
      60%  { transform: translateX(-3px); }
      80%  { transform: translateX(3px); }
    }
    .slot-reels.slot-shake { animation: slotShake 0.45s ease-in-out; }

    .slot-reel-wrap {
      flex: 1;
      height: 27vh;
      overflow: hidden;
      position: relative;
    }

    /* Fade masks */
    .slot-reel-wrap::before,
    .slot-reel-wrap::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 5vh;
      z-index: 5;
      pointer-events: none;
    }
    .slot-reel-wrap::before { top: 0;    background: linear-gradient(to bottom, #080808 10%, transparent); }
    .slot-reel-wrap::after  { bottom: 0; background: linear-gradient(to top,    #080808 10%, transparent); }

    .slot-reel-strip {
      display: flex;
      flex-direction: column;
      will-change: transform;
    }

    .slot-item {
      height: 9vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3vh;
      padding: 0.4vh 0.2vh;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      box-sizing: border-box;
    }

    .slot-item img {
      width: 90%;
      height: 5.8vh;
      object-fit: contain;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.7));
    }

    .slot-item-name {
      font-size: max(7px, 1.1vh);
      font-weight: 600;
      color: rgba(255,255,255,0.82);
      text-align: center;
      line-height: 1.2;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      width: 100%;
      padding: 0 2px;
      font-family: 'Sarabun', sans-serif;
    }

    .spin-btn {
      background: linear-gradient(135deg, #f5c842, #e8a020);
      color: #7a0000;
      border: none;
      border-radius: 30px;
      padding: 0.9vh 5vw;
      font-size: 2.2vh;
      font-weight: 800;
      cursor: pointer;
      font-family: 'Sarabun', sans-serif;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      letter-spacing: 1px;
    }
    .spin-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .prize-result {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.5vh;
      padding: 1vh 1.5vh;
      background: rgba(0,0,0,0.35);
      border-radius: 1.2vh;
      border: 1px solid #f5c842;
      width: 100%;
      text-align: center;
      animation: flash 0.5s ease-out;
    }
    .prize-result.show { display: flex; }

    .prize-result img {
      height: 7vh;
      object-fit: contain;
      border-radius: 0.8vh;
    }

    .prize-result-name {
      color: #f5c842;
      font-size: 2.4vh;
      font-weight: 800;
    }

    .prize-result-points {
      color: rgba(255,255,255,0.75);
      font-size: 1.7vh;
    }
  </style>
</head>
<body>

  <div class="dashboard-top">

  <div class="shop-banner">
    <img class="shop-logo" src="twc-logo.jpg" alt="โลโก้ห้างทองทวีชัย๙">
    <div class="shop-name">ห้างทองทวีชัย๙ (แต้จิ้นเฮง) สาย 5</div>
  </div>

  <header>
    <div class="header-left">
      <div class="brand">ราคาทองคำไทย</div>
      <div class="sub">Thai Gold Price · สมาคมค้าทองคำ</div>
    </div>
  </header>

  <div class="cards">
    <!-- ทองรูปพรรณ -->
    <div class="card loading" id="card-gold">
      <div class="card-icon">🥇</div>
      <div class="card-title">ทองรูปพรรณ 96.5%</div>
      <div class="price-row">
        <span class="price-label">ราคารับซื้อ</span>
        <span class="buy">
          <span class="price-value" id="gold-buy">กำลังโหลด</span>
          <span class="price-unit buy">บาท</span>
        </span>
      </div>
      <div class="price-row">
        <span class="price-label">ราคาขายออก</span>
        <span class="sell">
          <span class="price-value" id="gold-sell">กำลังโหลด</span>
          <span class="price-unit sell">บาท</span>
        </span>
      </div>
    </div>

    <!-- ทองคำแท่ง -->
    <div class="card loading" id="card-bar">
      <div class="card-icon">📦</div>
      <div class="card-title">ทองคำแท่ง 96.5%</div>
      <div class="price-row">
        <span class="price-label">ราคารับซื้อ</span>
        <span class="buy">
          <span class="price-value" id="bar-buy">กำลังโหลด</span>
          <span class="price-unit buy">บาท</span>
        </span>
      </div>
      <div class="price-row">
        <span class="price-label">ราคาขายออก</span>
        <span class="sell">
          <span class="price-value" id="bar-sell">กำลังโหลด</span>
          <span class="price-unit sell">บาท</span>
        </span>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-left">
      <div class="live-dot" id="live-dot"></div>
      <span id="update-info">กำลังโหลดข้อมูล...</span>
    </div>
    <div class="refresh-countdown" id="countdown">รีเฟรชทุก 5 นาที</div>
  </footer>

  </div>

  <div class="slideshow">
    <img class="slide-img" id="slideImg" src="slide-1.jpg" alt="สร้อยคอทอง 1 บาท">

    <!-- Mini-game button -->
    <button class="minigame-btn" id="minigameBtn" onclick="openGame()" title="หมุนรับรางวัล">🎡</button>

    <!-- Spinning wheel overlay -->
    <div class="game-overlay" id="gameOverlay">
      <div class="game-panel">
        <button class="close-game-btn" onclick="closeGame()">✕</button>
        <div class="game-title">🎡 หมุนรับรางวัล!</div>
        <div class="slot-reels">
          <div class="slot-reel-wrap"><div class="slot-reel-strip" id="strip-0"></div></div>
          <div class="slot-reel-wrap"><div class="slot-reel-strip" id="strip-1"></div></div>
          <div class="slot-reel-wrap"><div class="slot-reel-strip" id="strip-2"></div></div>
        </div>
        <button class="spin-btn" id="spinBtn" onclick="spin()">หมุน!</button>
        <div class="prize-result" id="prizeResult">
          <img id="prizeImg" src="" alt="รางวัล">
          <div class="prize-result-name" id="prizeResultName"></div>
          <div class="prize-result-points" id="prizeResultPoints"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Full-screen prize reveal overlay -->
  <div class="prize-reveal-overlay" id="prizeRevealOverlay" onclick="closePrizeReveal()">
    <div class="prize-reveal-inner">
      <div class="prize-reveal-congrats">🎉 ยินดีด้วย! 🎉</div>
      <img class="prize-reveal-img" id="prizeRevealImg" src="" alt="รางวัล">
      <div class="prize-reveal-name" id="prizeRevealName"></div>
      <div class="prize-reveal-value" id="prizeRevealValue"></div>
      <div class="prize-reveal-hint">แตะเพื่อปิด</div>
    </div>
  </div>

  <script>
    const INTERVAL_MS = 5 * 60 * 1000;
    let nextRefresh = Date.now() + INTERVAL_MS;

    // ── Countdown ──
    function updateCountdown() {
      const remaining = Math.max(0, Math.round((nextRefresh - Date.now()) / 1000));
      const m = String(Math.floor(remaining / 60)).padStart(2, '0');
      const s = String(remaining % 60).padStart(2, '0');
      document.getElementById('countdown').textContent = `รีเฟรชใน ${m}:${s}`;
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    // ── Data sources, each normalized to { gold:{buy,sell}, gold_bar:{buy,sell}, update_date, update_time } ──
    const OFFICIAL_URL = 'https://www.goldtraders.or.th/api/GoldPrices/Latest?readjson=false';
    const CHNWT_URL = 'https://api.chnwt.dev/thai-gold-api/latest';
    const proxy1 = (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u);
    const proxy2 = (u) => 'https://corsproxy.io/?' + encodeURIComponent(u);

    const fmt = (n) => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const ORNAMENT_BUY_DISCOUNT = 4500;

    function parseOfficial(d) {
      if (!d || !d.bL_BuyPrice) return null;
      const t = new Date(d.asTime);
      return {
        gold:     { buy: fmt(d.bL_BuyPrice - ORNAMENT_BUY_DISCOUNT), sell: fmt(d.bL_SellPrice) },
        gold_bar: { buy: fmt(d.bL_BuyPrice),                         sell: fmt(d.bL_SellPrice) },
        update_date: t.toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' }),
        update_time: 'เวลา ' + t.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.'
      };
    }

    function parseChnwt(d) {
      if (d?.status !== 'success' || !d.response?.price?.gold_bar?.buy) return null;
      const { price, update_date, update_time } = d.response;
      const barBuy = Number(String(price.gold_bar.buy).replace(/,/g, ''));
      return {
        gold:     { buy: fmt(barBuy - ORNAMENT_BUY_DISCOUNT), sell: price.gold_bar.sell },
        gold_bar: price.gold_bar,
        update_date, update_time
      };
    }

    const SOURCES = [
      { url: proxy1(OFFICIAL_URL), parse: parseOfficial },
      { url: proxy2(OFFICIAL_URL), parse: parseOfficial },
      { url: OFFICIAL_URL,         parse: parseOfficial },
      { url: CHNWT_URL,            parse: parseChnwt },
      { url: proxy1(CHNWT_URL),    parse: parseChnwt },
      { url: proxy2(CHNWT_URL),    parse: parseChnwt }
    ];

    async function fetchWithFallback() {
      for (const src of SOURCES) {
        try {
          const res = await fetch(src.url, { cache: 'no-store' });
          const data = await res.json();
          const parsed = src.parse(data);
          if (parsed) return parsed;
        } catch (e) { continue; }
      }
      throw new Error('No source returned prices');
    }

    // ── Fetch prices ──
    async function fetchPrices() {
      const dot  = document.getElementById('live-dot');
      const info = document.getElementById('update-info');

      try {
        const { gold, gold_bar, update_date, update_time } = await fetchWithFallback();

        const set = (id, val) => {
          const el = document.getElementById(id);
          el.textContent = val;
          el.closest('.card')?.classList.remove('loading');
          el.classList.add('flash');
          el.addEventListener('animationend', () => el.classList.remove('flash'), { once: true });
        };

        set('gold-buy',  gold.buy);
        set('gold-sell', gold.sell);
        set('bar-buy',   gold_bar.buy);
        set('bar-sell',  gold_bar.sell);

        dot.className = 'live-dot';
        info.textContent = `อัปเดตล่าสุด: ${update_date} ${update_time}`;

      } catch (err) {
        dot.className = 'live-dot error';
        info.textContent = 'รอราคาอัปเดตจากตลาด — กำลังลองใหม่...';
      }

      nextRefresh = Date.now() + INTERVAL_MS;
    }

    fetchPrices();
    setInterval(fetchPrices, INTERVAL_MS);

    // ── Image slideshow ──
    const SLIDE_COUNT = 65;
    const SLIDE_INTERVAL_MS = 5000;
    let slideIndex = 1;
    const slideImg = document.getElementById('slideImg');

    function nextSlide() {
      slideImg.style.opacity = 0;
      setTimeout(() => {
        slideIndex = (slideIndex % SLIDE_COUNT) + 1;
        slideImg.src = `slide-${slideIndex}.jpg`;
        slideImg.style.opacity = 1;
      }, 800);
    }
    setInterval(nextSlide, SLIDE_INTERVAL_MS);

    // ── Spinning Wheel Mini-game ──
    // blank:true = ช่องว่าง | weight = โอกาสถูกเลือก (0 = ไม่มีโอกาส)
    // ชาม 70% | ร่ม 10% | แก้วเก็บความเย็น 10% | เก้าอี้ 5% | พัดลมเทอร์โบ 5%
    const PRIZES = [
      { name: 'ช่องว่าง',               points: '',               img: '',             color: '#444',    blank: true, weight: 0 },
      { name: 'iPhone 17 Pro',          points: '1,250 คะแนน',   img: 'prize-1.jpg',  color: '#e74c3c', weight: 0 },
      { name: 'JBL Go 4',               points: '40 คะแนน',      img: 'prize-2.jpg',  color: '#3498db', weight: 0 },
      { name: 'TV Samsung 55"',         points: '275 คะแนน',     img: 'prize-3.jpg',  color: '#27ae60', weight: 0 },
      { name: 'ชามซูโทเปีย',            points: 'มูลค่า 199 บาท', img: 'prize-4.jpg',  color: '#f39c12', weight: 70/3 },
      { name: 'ชามมินนี้มิกกี้',         points: 'มูลค่า 199 บาท', img: 'prize-5.jpg',  color: '#9b59b6', weight: 70/3 },
      { name: 'ชามสนูปปี้',             points: 'มูลค่า 199 บาท', img: 'prize-6.jpg',  color: '#e91e63', weight: 70/3 },
      { name: 'ช่องว่าง',               points: '',               img: '',             color: '#444',    blank: true, weight: 0 },
      { name: 'พัดลม ฮาตาริ',           points: '25 คะแนน',      img: 'prize-7.jpg',  color: '#00897b', weight: 0 },
      { name: 'พัดลมเทอร์โบเจ็ท',       points: 'มูลค่า 990 บาท', img: 'prize-8.jpg',  color: '#1565c0', weight: 5 },
      { name: 'ร่มพับอัตโนมัติ',         points: 'มูลค่า 390 บาท', img: 'prize-9.jpg',  color: '#558b2f', weight: 10 },
      { name: 'เก้าอี้แคมปปิ้ง',        points: 'มูลค่า 390 บาท', img: 'prize-10.jpg', color: '#6d4c41', weight: 5 },
      { name: 'แก้วเก็บความเย็น',        points: 'มูลค่า 590 บาท', img: 'prize-11.jpg', color: '#1976d2', weight: 5 },
      { name: 'แก้วเก็บความเย็นหมาแมว',  points: 'มูลค่า 490 บาท', img: 'prize-12.jpg', color: '#d35400', weight: 5 },
    ];

    const PRIZE_INDICES = PRIZES.map((p, i) => (!p.blank && p.weight > 0) ? i : -1).filter(i => i >= 0);

    function weightedRandom() {
      const total = PRIZE_INDICES.reduce((sum, i) => sum + PRIZES[i].weight, 0);
      let r = Math.random() * total;
      for (const i of PRIZE_INDICES) {
        r -= PRIZES[i].weight;
        if (r <= 0) return i;
      }
      return PRIZE_INDICES[PRIZE_INDICES.length - 1];
    }

    // ── Web Audio (ไม่ใช้ไฟล์เพลง) ──
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTick(speed) {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.value = 280 + speed * 520;
        gain.gain.setValueAtTime(0.07 + speed * 0.09, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.045);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.045);
      } catch(e) {}
    }

    function playWin() {
      try {
        const ctx = getAudio();
        [523, 659, 784, 1047, 1319].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = 'sine';
          const t = ctx.currentTime + i * 0.11;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(0.22, t + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
          osc.start(t); osc.stop(t + 0.42);
        });
      } catch(e) {}
    }

    // ── Confetti ──
    function launchConfetti(container) {
      const target = container || document.querySelector('.game-panel');
      const colors = ['#f5c842','#e74c3c','#3498db','#2ecc71','#9b59b6','#ff9800','#fff'];
      const count = container ? 80 : 55;
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        const s = 5 + Math.random() * 8;
        el.style.cssText =
          `left:${2+Math.random()*96}%;width:${s}px;height:${s}px;` +
          `background:${colors[i % colors.length]};` +
          `border-radius:${Math.random() > 0.5 ? '50%' : '2px'};` +
          `animation-duration:${0.9+Math.random()*1.1}s;` +
          `animation-delay:${Math.random()*0.5}s`;
        target.appendChild(el);
        setTimeout(() => el.remove(), 2200);
      }
    }

    // ── Full-screen prize reveal ──
    function openPrizeReveal(prize) {
      document.getElementById('prizeRevealImg').src   = prize.img;
      document.getElementById('prizeRevealName').textContent  = prize.name;
      document.getElementById('prizeRevealValue').textContent = prize.points;
      const overlay = document.getElementById('prizeRevealOverlay');
      overlay.classList.add('open');
      launchConfetti(overlay);
    }

    function closePrizeReveal() {
      document.getElementById('prizeRevealOverlay').classList.remove('open');
    }

    // ── Slot Machine ──
    const SLOT_ITEMS = PRIZES.filter(p => !p.blank); // 12 prizes (รวม display-only)
    const SLOT_N     = SLOT_ITEMS.length;
    const SLOT_LOOPS = [6, 7, 9];          // รอบที่แต่ละรีลหมุนก่อนหยุด
    const SLOT_STOPS = [1400, 2700, 4400]; // ms ที่แต่ละรีลหยุด (รีลสุดท้ายช้ากว่า = ลุ้นกว่า)

    let slotSpinning = false;

    function getItemH() { return window.innerHeight * 0.09; } // 9vh in px

    function buildStrip(rIdx, targetSlotIdx) {
      const strip = document.getElementById(`strip-${rIdx}`);
      const total = SLOT_LOOPS[rIdx] * SLOT_N + targetSlotIdx + 3;
      const frag  = document.createDocumentFragment();
      for (let i = 0; i < total; i++) {
        const p   = SLOT_ITEMS[i % SLOT_N];
        const div = document.createElement('div');
        div.className = 'slot-item';
        div.innerHTML = p.img
          ? `<img src="${p.img}" alt="${p.name}"><div class="slot-item-name">${p.name}</div>`
          : `<div class="slot-item-name" style="opacity:.2">—</div>`;
        frag.appendChild(div);
      }
      strip.innerHTML = '';
      strip.appendChild(frag);
      strip.style.transform = 'translateY(0)';
    }

    function initSlot() {
      for (let r = 0; r < 3; r++) buildStrip(r, (r * 4) % SLOT_N);
    }

    function playStopSound() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(140, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(55, ctx.currentTime + 0.13);
        gain.gain.setValueAtTime(0.13, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.18);
      } catch(e) {}
    }

    function openGame() {
      document.getElementById('gameOverlay').classList.add('open');
      initSlot();
      document.getElementById('prizeResult').classList.remove('show');
      const btn = document.getElementById('spinBtn');
      btn.disabled = false; btn.textContent = 'หมุน!';
    }

    function closeGame() {
      document.getElementById('gameOverlay').classList.remove('open');
    }

    /* รีลแฟลชเมื่อได้ decoy 2 ช่องแรก */
    function flashReels() {
      const el = document.querySelector('.slot-reels');
      el.classList.remove('slot-flash', 'slot-shake');
      void el.offsetWidth; // reflow
      el.classList.add('slot-flash');
      setTimeout(() => {
        el.classList.remove('slot-flash');
        el.classList.add('slot-shake');
        setTimeout(() => el.classList.remove('slot-shake'), 450);
      }, 750);
    }

    /* เสียงลุ้น – ซ้ำ 3 ครั้ง pitch สูงขึ้น */
    function playTease() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ac = new AC();
      [0, 160, 320].forEach(delay => {
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type = 'square';
        o.frequency.value = 480 + delay * 2;
        g.gain.setValueAtTime(0.18, ac.currentTime + delay / 1000);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + delay / 1000 + 0.12);
        o.start(ac.currentTime + delay / 1000);
        o.stop(ac.currentTime + delay / 1000 + 0.13);
      });
    }

    function spin() {
      if (slotSpinning) return;
      slotSpinning = true;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('prizeResult').classList.remove('show');

      const prizeIndex    = weightedRandom();
      const prize         = PRIZES[prizeIndex];
      const winnerSlotIdx = SLOT_ITEMS.indexOf(prize);

      // รายการ decoy: รางวัล weight=0 (iPhone / JBL / TV / พัดลม ฮาตาริ)
      const DECOYS = PRIZES.filter(p => !p.blank && p.weight === 0);
      const decoy  = DECOYS[Math.floor(Math.random() * DECOYS.length)];
      const decoySlotIdx = SLOT_ITEMS.indexOf(decoy);

      // 65% near-miss (รีล 0,1 → decoy  |  รีล 2 → ผู้ชนะจริง)
      // 35% clean win  (ทั้ง 3 รีล → ผู้ชนะจริง)
      const nearMiss = Math.random() < 0.65;
      const targets = nearMiss
        ? [decoySlotIdx, decoySlotIdx, winnerSlotIdx]
        : [winnerSlotIdx, winnerSlotIdx, winnerSlotIdx];

      for (let r = 0; r < 3; r++) buildStrip(r, targets[r]);

      requestAnimationFrame(() => {
        const itemH     = getItemH();
        let   doneCount = 0;
        const startTime = performance.now();
        function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

        for (let r = 0; r < 3; r++) {
          const strip  = document.getElementById(`strip-${r}`);
          const winPos = SLOT_LOOPS[r] * SLOT_N + targets[r];
          const finalY = -(winPos - 1) * itemH;
          const stopMS = SLOT_STOPS[r];

          (function(s, fy, st, reelIdx) {
            let lastItem = 0;
            function frame(now) {
              const t = Math.min((now - startTime) / st, 1);
              const y = fy * easeOut(t);
              s.style.transform = `translateY(${y}px)`;
              const cur = Math.floor(-y / itemH);
              if (cur > lastItem) { lastItem = cur; if (1 - t > 0.04) playTick(1 - t); }
              if (t < 1) {
                requestAnimationFrame(frame);
              } else {
                s.style.transform = `translateY(${fy}px)`;
                playStopSound();
                // รีลที่ 1 หยุด + เป็น near-miss → แฟลช + เสียงลุ้น
                if (reelIdx === 1 && nearMiss) {
                  playTease();
                  flashReels();
                }
                if (++doneCount === 3) { slotSpinning = false; showResult(prizeIndex); }
              }
            }
            requestAnimationFrame(frame);
          })(strip, finalY, stopMS, r);
        }
      });
    }

    function showResult(index) {
      const prize = PRIZES[index];
      const img = document.getElementById('prizeImg');
      img.src = prize.img; img.style.display = '';
      document.getElementById('prizeResultName').textContent  = '🎉 ' + prize.name;
      document.getElementById('prizeResultPoints').textContent = prize.points;
      document.getElementById('prizeResult').classList.add('show');
      launchConfetti();
      playWin();
      const btn = document.getElementById('spinBtn');
      btn.textContent = 'เริ่มใหม่'; btn.disabled = false;
      // เปิดภาพใหญ่เต็มจอหลังจาก 400ms
      setTimeout(() => openPrizeReveal(prize), 400);
    }

  </script>
</body>
</html>
