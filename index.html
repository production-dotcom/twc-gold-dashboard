<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ราคาทองคำ</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(160deg, #7a0000 0%, #b00000 50%, #8b0000 100%);
      color: #fff;
      font-family: 'Sarabun', 'Segoe UI', sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* ── Top half: price dashboard ── */
    .dashboard-top {
      flex: 0 0 50%;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 14px 8px;
      overflow-y: auto;
    }

    /* ── Bottom half: image slideshow ── */
    .slideshow {
      flex: 0 0 50%;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 1;
      transition: opacity 0.8s ease;
    }

    /* ── Shop name banner ── */
    .shop-banner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6vh;
      margin-bottom: 1vh;
      padding-bottom: 1vh;
      border-bottom: 1px solid rgba(245, 200, 66, 0.4);
    }

    .shop-logo {
      position: absolute;
      top: 6px;
      left: 10px;
      height: 6vh;
      width: 6vh;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
    }

    .shop-name {
      font-size: 2.8vh;
      font-weight: 800;
      color: #f5c842;
      letter-spacing: 1px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
      text-align: center;
    }

    /* ── Header ── */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0.3vh;
      margin-bottom: 1vh;
    }

    .header-left .brand {
      font-size: 2.5vh;
      font-weight: 700;
      color: #f5c842;
      letter-spacing: 0.5px;
    }

    .header-left .sub {
      font-size: 1.3vh;
      color: #999;
      margin-top: 1px;
    }

    /* ── Cards ── */
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5vh;
    }

    .card {
      background: rgba(0, 0, 0, 0.40);
      border: 1px solid rgba(245, 200, 66, 0.25);
      border-radius: 1.2vh;
      padding: 1.5vh 1.8vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, #f5c842, #e8a020);
      border-radius: 1.2vh 1.2vh 0 0;
    }

    .card-icon {
      font-size: 2.6vh;
      margin-bottom: 0.3vh;
    }

    .card-title {
      font-size: 2.3vh;
      font-weight: 700;
      color: #f5c842;
      margin-bottom: 1vh;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 1vh 0;
    }

    .price-row + .price-row {
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .price-label {
      font-size: 2vh;
      color: rgba(255,255,255,0.65);
      font-weight: 400;
    }

    .price-value {
      font-size: 3.7vh;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .price-unit {
      font-size: 1.4vh;
      font-weight: 400;
      color: inherit;
      opacity: 0.6;
      margin-left: 4px;
    }

    .buy  { color: #4ade80; }
    .sell { color: #f87171; }

    .loading .price-value { color: rgba(255,255,255,0.2); }

    /* ── Footer ── */
    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3vh;
      margin-top: 1vh;
      padding-top: 1vh;
      border-top: 1px solid rgba(245, 200, 66, 0.25);
      color: rgba(255,255,255,0.45);
      font-size: 1.6vh;
      text-align: center;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 1.1vh;
      height: 1.1vh;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2.5s ease-in-out infinite;
    }

    .live-dot.error { background: #f87171; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    #update-info { color: rgba(255,255,255,0.5); }

    .refresh-countdown {
      font-size: 1.3vh;
      color: rgba(255,255,255,0.35);
    }

    /* ── Fade animation on data refresh ── */
    .flash {
      animation: flash 0.6s ease-out;
    }

    @keyframes flash {
      0%   { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* ── Mini-game button ── */
    .minigame-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(245, 200, 66, 0.92);
      color: #7a0000;
      border: none;
      border-radius: 50%;
      width: 5.5vh;
      height: 5.5vh;
      font-size: 2.8vh;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 14px rgba(0,0,0,0.55);
      transition: transform 0.2s;
      font-family: 'Sarabun', sans-serif;
    }
    .minigame-btn:hover { transform: scale(1.15) rotate(20deg); }

    /* ── Game overlay (covers slideshow area) ── */
    .game-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(0,0,0,0.88);
      align-items: center;
      justify-content: center;
    }
    .game-overlay.open { display: flex; }

    .game-panel {
      background: linear-gradient(160deg, #6a0000 0%, #a00000 100%);
      border: 2px solid #f5c842;
      border-radius: 2vh;
      padding: 1.5vh 1.8vh 1.8vh;
      width: 92%;
      max-height: 96%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1vh;
      position: relative;
    }

    .game-title {
      color: #f5c842;
      font-size: 2.6vh;
      font-weight: 800;
      text-align: center;
      letter-spacing: 1px;
    }

    .close-game-btn {
      position: absolute;
      top: 0.8vh;
      right: 1.2vh;
      background: none;
      border: none;
      color: rgba(255,255,255,0.55);
      font-size: 2.2vh;
      cursor: pointer;
      line-height: 1;
    }
    .close-game-btn:hover { color: #fff; }

    .wheel-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 1.2vh;
    }

    .wheel-pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.6vh;
      color: #f5c842;
      z-index: 5;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.9));
      line-height: 1;
    }

    #wheelCanvas {
      display: block;
      border-radius: 50%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6), 0 0 0 3px #f5c842;
    }

    .spin-btn {
      background: linear-gradient(135deg, #f5c842, #e8a020);
      color: #7a0000;
      border: none;
      border-radius: 30px;
      padding: 0.9vh 5vw;
      font-size: 2.2vh;
      font-weight: 800;
      cursor: pointer;
      font-family: 'Sarabun', sans-serif;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      letter-spacing: 1px;
    }
    .spin-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .prize-result {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.5vh;
      padding: 1vh 1.5vh;
      background: rgba(0,0,0,0.35);
      border-radius: 1.2vh;
      border: 1px solid #f5c842;
      width: 100%;
      text-align: center;
      animation: flash 0.5s ease-out;
    }
    .prize-result.show { display: flex; }

    .prize-result img {
      height: 7vh;
      object-fit: contain;
      border-radius: 0.8vh;
    }

    .prize-result-name {
      color: #f5c842;
      font-size: 2.4vh;
      font-weight: 800;
    }

    .prize-result-points {
      color: rgba(255,255,255,0.75);
      font-size: 1.7vh;
    }
  </style>
</head>
<body>

  <div class="dashboard-top">

  <div class="shop-banner">
    <img class="shop-logo" src="twc-logo.jpg" alt="โลโก้ห้างทองทวีชัย๙">
    <div class="shop-name">ห้างทองทวีชัย๙ (แต้จิ้นเฮง) สาย 5</div>
  </div>

  <header>
    <div class="header-left">
      <div class="brand">ราคาทองคำไทย</div>
      <div class="sub">Thai Gold Price · สมาคมค้าทองคำ</div>
    </div>
  </header>

  <div class="cards">
    <!-- ทองรูปพรรณ -->
    <div class="card loading" id="card-gold">
      <div class="card-icon">🥇</div>
      <div class="card-title">ทองรูปพรรณ 96.5%</div>
      <div class="price-row">
        <span class="price-label">ราคารับซื้อ</span>
        <span class="buy">
          <span class="price-value" id="gold-buy">กำลังโหลด</span>
          <span class="price-unit buy">บาท</span>
        </span>
      </div>
      <div class="price-row">
        <span class="price-label">ราคาขายออก</span>
        <span class="sell">
          <span class="price-value" id="gold-sell">กำลังโหลด</span>
          <span class="price-unit sell">บาท</span>
        </span>
      </div>
    </div>

    <!-- ทองคำแท่ง -->
    <div class="card loading" id="card-bar">
      <div class="card-icon">📦</div>
      <div class="card-title">ทองคำแท่ง 96.5%</div>
      <div class="price-row">
        <span class="price-label">ราคารับซื้อ</span>
        <span class="buy">
          <span class="price-value" id="bar-buy">กำลังโหลด</span>
          <span class="price-unit buy">บาท</span>
        </span>
      </div>
      <div class="price-row">
        <span class="price-label">ราคาขายออก</span>
        <span class="sell">
          <span class="price-value" id="bar-sell">กำลังโหลด</span>
          <span class="price-unit sell">บาท</span>
        </span>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-left">
      <div class="live-dot" id="live-dot"></div>
      <span id="update-info">กำลังโหลดข้อมูล...</span>
    </div>
    <div class="refresh-countdown" id="countdown">รีเฟรชทุก 5 นาที</div>
  </footer>

  </div>

  <div class="slideshow">
    <img class="slide-img" id="slideImg" src="slide-1.jpg" alt="สร้อยคอทอง 1 บาท">

    <!-- Mini-game button -->
    <button class="minigame-btn" id="minigameBtn" onclick="openGame()" title="หมุนรับรางวัล">🎡</button>

    <!-- Spinning wheel overlay -->
    <div class="game-overlay" id="gameOverlay">
      <div class="game-panel">
        <button class="close-game-btn" onclick="closeGame()">✕</button>
        <div class="game-title">🎡 หมุนรับรางวัล!</div>
        <div class="wheel-wrap">
          <div class="wheel-pointer">▼</div>
          <canvas id="wheelCanvas"></canvas>
        </div>
        <button class="spin-btn" id="spinBtn" onclick="spin()">หมุน!</button>
        <div class="prize-result" id="prizeResult">
          <img id="prizeImg" src="" alt="รางวัล">
          <div class="prize-result-name" id="prizeResultName"></div>
          <div class="prize-result-points" id="prizeResultPoints"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const INTERVAL_MS = 5 * 60 * 1000;
    let nextRefresh = Date.now() + INTERVAL_MS;

    // ── Countdown ──
    function updateCountdown() {
      const remaining = Math.max(0, Math.round((nextRefresh - Date.now()) / 1000));
      const m = String(Math.floor(remaining / 60)).padStart(2, '0');
      const s = String(remaining % 60).padStart(2, '0');
      document.getElementById('countdown').textContent = `รีเฟรชใน ${m}:${s}`;
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    // ── Data sources, each normalized to { gold:{buy,sell}, gold_bar:{buy,sell}, update_date, update_time } ──
    const OFFICIAL_URL = 'https://www.goldtraders.or.th/api/GoldPrices/Latest?readjson=false';
    const CHNWT_URL = 'https://api.chnwt.dev/thai-gold-api/latest';
    const proxy1 = (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u);
    const proxy2 = (u) => 'https://corsproxy.io/?' + encodeURIComponent(u);

    const fmt = (n) => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const ORNAMENT_BUY_DISCOUNT = 4500;

    function parseOfficial(d) {
      if (!d || !d.bL_BuyPrice) return null;
      const t = new Date(d.asTime);
      return {
        gold:     { buy: fmt(d.bL_BuyPrice - ORNAMENT_BUY_DISCOUNT), sell: fmt(d.bL_SellPrice) },
        gold_bar: { buy: fmt(d.bL_BuyPrice),                         sell: fmt(d.bL_SellPrice) },
        update_date: t.toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' }),
        update_time: 'เวลา ' + t.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.'
      };
    }

    function parseChnwt(d) {
      if (d?.status !== 'success' || !d.response?.price?.gold_bar?.buy) return null;
      const { price, update_date, update_time } = d.response;
      const barBuy = Number(String(price.gold_bar.buy).replace(/,/g, ''));
      return {
        gold:     { buy: fmt(barBuy - ORNAMENT_BUY_DISCOUNT), sell: price.gold_bar.sell },
        gold_bar: price.gold_bar,
        update_date, update_time
      };
    }

    const SOURCES = [
      { url: proxy1(OFFICIAL_URL), parse: parseOfficial },
      { url: proxy2(OFFICIAL_URL), parse: parseOfficial },
      { url: OFFICIAL_URL,         parse: parseOfficial },
      { url: CHNWT_URL,            parse: parseChnwt },
      { url: proxy1(CHNWT_URL),    parse: parseChnwt },
      { url: proxy2(CHNWT_URL),    parse: parseChnwt }
    ];

    async function fetchWithFallback() {
      for (const src of SOURCES) {
        try {
          const res = await fetch(src.url, { cache: 'no-store' });
          const data = await res.json();
          const parsed = src.parse(data);
          if (parsed) return parsed;
        } catch (e) { continue; }
      }
      throw new Error('No source returned prices');
    }

    // ── Fetch prices ──
    async function fetchPrices() {
      const dot  = document.getElementById('live-dot');
      const info = document.getElementById('update-info');

      try {
        const { gold, gold_bar, update_date, update_time } = await fetchWithFallback();

        const set = (id, val) => {
          const el = document.getElementById(id);
          el.textContent = val;
          el.closest('.card')?.classList.remove('loading');
          el.classList.add('flash');
          el.addEventListener('animationend', () => el.classList.remove('flash'), { once: true });
        };

        set('gold-buy',  gold.buy);
        set('gold-sell', gold.sell);
        set('bar-buy',   gold_bar.buy);
        set('bar-sell',  gold_bar.sell);

        dot.className = 'live-dot';
        info.textContent = `อัปเดตล่าสุด: ${update_date} ${update_time}`;

      } catch (err) {
        dot.className = 'live-dot error';
        info.textContent = 'รอราคาอัปเดตจากตลาด — กำลังลองใหม่...';
      }

      nextRefresh = Date.now() + INTERVAL_MS;
    }

    fetchPrices();
    setInterval(fetchPrices, INTERVAL_MS);

    // ── Image slideshow ──
    const SLIDE_COUNT = 65;
    const SLIDE_INTERVAL_MS = 5000;
    let slideIndex = 1;
    const slideImg = document.getElementById('slideImg');

    function nextSlide() {
      slideImg.style.opacity = 0;
      setTimeout(() => {
        slideIndex = (slideIndex % SLIDE_COUNT) + 1;
        slideImg.src = `slide-${slideIndex}.jpg`;
        slideImg.style.opacity = 1;
      }, 800);
    }
    setInterval(nextSlide, SLIDE_INTERVAL_MS);

    // ── Spinning Wheel Mini-game ──
    const PRIZES = [
      { name: 'iPhone 17 Pro',        points: '1,250 คะแนน', img: 'prize-1.jpg', color: '#e74c3c' },
      { name: 'JBL Go 4',             points: '40 คะแนน',    img: 'prize-2.jpg', color: '#3498db' },
      { name: 'TV Samsung 55"',       points: '275 คะแนน',   img: 'prize-3.jpg', color: '#27ae60' },
      { name: 'พัดลม Jiso-Life 1 Pro', points: '25 คะแนน',   img: 'prize-4.jpg', color: '#f39c12' },
      { name: 'พัดลม ฮาตาริ 16นิ้ว',  points: '25 คะแนน',   img: 'prize-5.jpg', color: '#8e44ad' },
      { name: 'ร่มพรีเมียม',           points: '3 คะแนน',    img: 'prize-6.jpg', color: '#16a085' },
      { name: 'แก้วเก็บความเย็น',      points: '3 คะแนน',    img: 'prize-7.jpg', color: '#d35400' },
    ];

    let wheelAngle = 0;
    let isSpinning = false;

    function openGame() {
      const overlay = document.getElementById('gameOverlay');
      overlay.classList.add('open');
      initCanvas();
      drawWheel();
      document.getElementById('prizeResult').classList.remove('show');
      const btn = document.getElementById('spinBtn');
      btn.disabled = false;
      btn.textContent = 'หมุน!';
    }

    function closeGame() {
      document.getElementById('gameOverlay').classList.remove('open');
    }

    function initCanvas() {
      const canvas = document.getElementById('wheelCanvas');
      const panel = document.querySelector('.game-panel');
      const size = Math.min(Math.floor(panel.clientWidth * 0.72), 220);
      canvas.width = size;
      canvas.height = size;
    }

    function drawWheel() {
      const canvas = document.getElementById('wheelCanvas');
      const ctx = canvas.getContext('2d');
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const r = cx - 3;
      const segAngle = (2 * Math.PI) / PRIZES.length;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      PRIZES.forEach((prize, i) => {
        const sA = -Math.PI / 2 + wheelAngle + i * segAngle;
        const eA = sA + segAngle;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, sA, eA);
        ctx.closePath();
        ctx.fillStyle = prize.color;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(sA + segAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 3;
        const fs = Math.max(8, Math.floor(r * 0.1));
        ctx.font = `bold ${fs}px Sarabun, sans-serif`;
        ctx.fillText(prize.name, r - 6, fs * 0.35);
        ctx.restore();
      });

      // Center circle
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(10, r * 0.09), 0, 2 * Math.PI);
      ctx.fillStyle = '#f5c842';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('prizeResult').classList.remove('show');

      const segAngle = (2 * Math.PI) / PRIZES.length;
      const targetIndex = Math.floor(Math.random() * PRIZES.length);
      const extraSpins = (5 + Math.floor(Math.random() * 5)) * 2 * Math.PI;
      const desiredNorm = (2 * Math.PI - targetIndex * segAngle + segAngle * (0.3 + Math.random() * 0.4)) % (2 * Math.PI);
      const curNorm = ((wheelAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      let delta = desiredNorm - curNorm;
      if (delta < 0) delta += 2 * Math.PI;

      const totalSpin = extraSpins + delta;
      const startAngle = wheelAngle;
      const duration = 3800 + Math.random() * 1000;
      const startTime = performance.now();

      function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

      function animate(now) {
        const t = Math.min((now - startTime) / duration, 1);
        wheelAngle = startAngle + totalSpin * easeOut(t);
        drawWheel();
        if (t < 1) {
          requestAnimationFrame(animate);
        } else {
          wheelAngle = startAngle + totalSpin;
          isSpinning = false;
          showResult(targetIndex);
        }
      }

      requestAnimationFrame(animate);
    }

    function showResult(index) {
      const prize = PRIZES[index];
      document.getElementById('prizeImg').src = prize.img;
      document.getElementById('prizeResultName').textContent = '🎉 ' + prize.name;
      document.getElementById('prizeResultPoints').textContent = prize.points;
      document.getElementById('prizeResult').classList.add('show');
      const btn = document.getElementById('spinBtn');
      btn.textContent = 'หมุนอีกครั้ง';
      btn.disabled = false;
    }

  </script>
</body>
</html>
