<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ราคาทอง</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #1a0a00;
      font-family: 'Noto Sans Thai', 'Segoe UI', sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* ══════════════════════════════════════════
       SECTION 1 – Header (Logo + Title)
    ══════════════════════════════════════════ */
    .header-section {
      flex: 0 0 23vh;
      background: linear-gradient(170deg, #5a0000 0%, #8b0000 55%, #7a0000 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.2vh 2vw;
      gap: 0.5vh;
      border-bottom: 3px solid #c8a000;
      position: relative;
    }

    .logo-circle {
      height: 10vh;
      width: 10vh;
      object-fit: cover;
      border-radius: 50%;
      filter: drop-shadow(0 3px 14px rgba(0,0,0,0.75));
      flex-shrink: 0;
    }

    .header-title {
      font-size: 4.5vh;
      font-weight: 800;
      color: #f5c842;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 14px rgba(0,0,0,0.7);
      line-height: 1;
    }

    .header-shopname {
      font-size: 1.8vh;
      font-weight: 600;
      color: rgba(255,255,255,0.82);
      letter-spacing: 0.3px;
    }

    .header-update {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 0.2vh;
    }

    .live-dot {
      width: 1.1vh;
      height: 1.1vh;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2.5s ease-in-out infinite;
      flex-shrink: 0;
    }
    .live-dot.error { background: #f87171; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.35; transform: scale(0.85); }
    }

    #update-info {
      font-size: 1.7vh;
      color: rgba(255,255,255,0.58);
    }

    /* ══════════════════════════════════════════
       SECTIONS 2-4 – Price Rows
    ══════════════════════════════════════════ */
    .price-section {
      flex: 0 0 29vh;
      display: flex;
      flex-direction: column;
    }

    .price-row-item {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 5vw;
      position: relative;
    }

    .price-row-item:not(:last-child)::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(170,120,0,0.5) 30%, rgba(170,120,0,0.5) 70%, transparent);
    }

    /* Row colours – light gold palette */
    .row-buy-jewelry { background: #fdf3c0; }
    .row-buy-bar     { background: #faeaa0; }
    .row-sell        { background: #fdf0b0; }

    .price-label-block {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4vh;
    }

    .price-type {
      font-size: 3.2vh;
      font-weight: 800;
      color: #3d1a00;
      line-height: 1;
    }

    .price-subtype {
      font-size: 2vh;
      font-weight: 500;
      color: #7a5000;
    }

    .price-number-wrap {
      display: flex;
      align-items: baseline;
      gap: 0.7vw;
    }

    .price-number {
      font-size: 7vh;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .price-number.buy  { color: #154d00; }
    .price-number.sell { color: #850000; }

    .price-unit-label {
      font-size: 2.2vh;
      font-weight: 500;
      color: #7a5000;
      padding-bottom: 0.8vh;
    }

    /* Flash animation on data refresh */
    .flash { animation: flash 0.6s ease-out; }
    @keyframes flash {
      0%   { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* ══════════════════════════════════════════
       Footer bar
    ══════════════════════════════════════════ */
    .footer-bar {
      flex: 0 0 3vh;
      background: linear-gradient(90deg, #3d1a00 0%, #6a0000 50%, #3d1a00 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid rgba(200,160,0,0.35);
    }

    #countdown {
      font-size: 1.6vh;
      color: rgba(245,200,66,0.55);
    }

    /* ══════════════════════════════════════════
       SECTION 5 – Slideshow + Mini-game
    ══════════════════════════════════════════ */
    .slideshow {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
      min-height: 0;
    }

    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 1;
      transition: opacity 0.8s ease;
    }

    /* ── Mini-game button ── */
    .minigame-btn {
      position: absolute;
      bottom: 3vh;
      right: 12px;
      z-index: 10;
      background: rgba(245, 200, 66, 0.92);
      color: #7a0000;
      border: none;
      border-radius: 50%;
      width: 5.5vh;
      height: 5.5vh;
      font-size: 2.8vh;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 14px rgba(0,0,0,0.55);
      transition: transform 0.2s;
      font-family: 'Sarabun', sans-serif;
    }
    .minigame-btn:hover { transform: scale(1.15) rotate(20deg); }

    /* ── Game overlay (covers slideshow area) ── */
    .game-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(0,0,0,0.88);
      align-items: center;
      justify-content: center;
    }
    .game-overlay.open { display: flex; }

    .game-panel { background: linear-gradient(160deg,#6a0000 0%,#a00000 100%); border: 2px solid #f5c842; border-radius: 2vh; padding: 1.5vh 1.8vh 1.8vh; width: 92%; max-height: 96%; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 1vh; position: relative; }
    .game-title { color: #f5c842; font-size: 2.6vh; font-weight: 800; text-align: center; letter-spacing: 1px; }
    .close-game-btn { position: absolute; top: 0.8vh; right: 1.2vh; background: none; border: none; color: rgba(255,255,255,0.55); font-size: 2.2vh; cursor: pointer; line-height: 1; }
    .close-game-btn:hover { color: #fff; }
    .wheel-wrap { position: relative; display: flex; align-items: center; justify-content: center; padding-top: 1.2vh; }
    .wheel-pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-size: 2.6vh; color: #f5c842; z-index: 5; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.9)); line-height: 1; }
    #wheelCanvas { display: block; border-radius: 50%; box-shadow: 0 4px 24px rgba(0,0,0,0.6), 0 0 0 3px #f5c842; }
    .spin-btn { background: linear-gradient(135deg,#f5c842,#e8a020); color: #7a0000; border: none; border-radius: 30px; padding: 0.9vh 5vw; font-size: 2.2vh; font-weight: 800; cursor: pointer; font-family: 'Noto Sans Thai',sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,0.35); letter-spacing: 1px; }
    .spin-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .prize-result { display: none; flex-direction: column; align-items: center; gap: 0.5vh; padding: 1vh 1.5vh; background: rgba(0,0,0,0.35); border-radius: 1.2vh; border: 1px solid #f5c842; width: 100%; text-align: center; }
    .prize-result.show { display: flex; animation: prizeReveal 0.45s cubic-bezier(0.175,0.885,0.32,1.275) both; }
    .prize-result img { height: 7vh; object-fit: contain; border-radius: 0.8vh; }
    .prize-result-name { color: #f5c842; font-size: 2.4vh; font-weight: 800; }
    .prize-result-points { color: rgba(255,255,255,0.75); font-size: 1.7vh; }

    @keyframes prizeReveal {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.07); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ── Confetti ── */
    .confetti-piece {
      position: absolute;
      top: 0;
      pointer-events: none;
      z-index: 50;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-5px) rotate(0deg); opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateY(200px) rotate(560deg); opacity: 0; }
    }

    /* ── Full-screen prize reveal ── */
    .prize-reveal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(0,0,0,0.93);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }
    .prize-reveal-overlay.open { display: flex; }

    .prize-reveal-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.2vh;
      padding: 3vh 4vw;
      animation: prizeRevealFull 0.55s cubic-bezier(0.175,0.885,0.32,1.275) both;
      pointer-events: none;
    }
    @keyframes prizeRevealFull {
      0%   { transform: scale(0.25) rotate(-8deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .prize-reveal-congrats {
      font-size: 5vh; font-weight: 800; color: #f5c842;
      text-shadow: 0 0 30px rgba(245,200,66,0.9), 0 2px 8px rgba(0,0,0,0.8);
      text-align: center; font-family: 'Sarabun', sans-serif;
    }
    .prize-reveal-img {
      max-height: 42vh; max-width: 86vw; object-fit: contain;
      border-radius: 2.5vh;
      box-shadow: 0 8px 50px rgba(0,0,0,0.7), 0 0 0 3px rgba(245,200,66,0.5);
    }
    .prize-reveal-name {
      font-size: 4.5vh; font-weight: 800; color: #fff; text-align: center;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8); font-family: 'Sarabun', sans-serif;
    }
    .prize-reveal-value {
      font-size: 2.8vh; font-weight: 600; color: #f5c842; font-family: 'Sarabun', sans-serif;
    }
    .prize-reveal-hint {
      font-size: 1.8vh; color: rgba(255,255,255,0.35); margin-top: 1vh;
      font-family: 'Sarabun', sans-serif; animation: hintBlink 1.8s ease-in-out infinite;
    }
    @keyframes hintBlink {
      0%,100% { opacity: 0.35; }
      50%      { opacity: 0.75; }
    }
  </style>
</head>
<body>

  <!-- ══ SECTION 1: Header ══ -->
  <div class="header-section">
    <img class="logo-circle" src="twc-logo.png" alt="โลโก้ห้างทองทวีชัย๙">
    <div class="header-title">ราคาทองคำวันนี้</div>
    <div class="header-shopname">ห้างทองทวีชัย ๙ (แต้จิ้นเฮง) สาย 5</div>
    <div class="header-update">
      <div class="live-dot" id="live-dot"></div>
      <span id="update-info">กำลังโหลดข้อมูล...</span>
    </div>
  </div>

  <!-- ══ SECTIONS 2-4: Price Rows ══ -->
  <div class="price-section">

    <!-- รับซื้อ ทองคำแท่ง -->
    <div class="price-row-item row-buy-bar">
      <div class="price-label-block">
        <div class="price-type">รับซื้อ</div>
        <div class="price-subtype">ทองคำแท่ง 96.5%</div>
      </div>
      <div class="price-number-wrap">
        <div class="price-number buy" id="bar-buy">—</div>
        <div class="price-unit-label">บาท</div>
      </div>
    </div>

    <!-- ขายออก ทองแท่ง -->
    <div class="price-row-item row-sell">
      <div class="price-label-block">
        <div class="price-type">ขายออก</div>
        <div class="price-subtype">ทองคำแท่ง 96.5%</div>
      </div>
      <div class="price-number-wrap">
        <div class="price-number sell" id="bar-sell">—</div>
        <div class="price-unit-label">บาท</div>
      </div>
    </div>

    <!-- รับซื้อ ทองรูปพรรณ -->
    <div class="price-row-item row-buy-jewelry">
      <div class="price-label-block">
        <div class="price-type">รับซื้อ</div>
        <div class="price-subtype">ทองรูปพรรณ 96.5%</div>
      </div>
      <div class="price-number-wrap">
        <div class="price-number buy" id="gold-buy">—</div>
        <div class="price-unit-label">บาท</div>
      </div>
    </div>

  </div>

  <!-- hidden: keeps JS set() happy for unused gold-sell -->
  <span id="gold-sell" style="display:none"></span>

  <!-- ══ Footer bar ══ -->
  <div class="footer-bar">
    <span id="countdown">รีเฟรชทุก 5 นาที</span>
  </div>

  <!-- ══ SECTION 5: Slideshow + Mini-game ══ -->
  <div class="slideshow">
    <img class="slide-img" id="slideImg" src="slide-1.jpg" alt="สินค้าทอง">

    <!-- Mini-game button -->
    <button class="minigame-btn" id="minigameBtn" onclick="openGame()" title="หมุนรับรางวัล">🎡</button>

    <!-- Spinning wheel overlay -->
    <div class="game-overlay" id="gameOverlay">
      <div class="game-panel">
        <button class="close-game-btn" onclick="closeGame()">✕</button>
        <div class="game-title">🎡 หมุนรับรางวัล!</div>
        <div class="wheel-wrap">
          <div class="wheel-pointer">▼</div>
          <canvas id="wheelCanvas"></canvas>
        </div>
        <button class="spin-btn" id="spinBtn" onclick="spin()">หมุน!</button>
        <div class="prize-result" id="prizeResult">
          <img id="prizeImg" src="" alt="รางวัล">
          <div class="prize-result-name" id="prizeResultName"></div>
          <div class="prize-result-points" id="prizeResultPoints"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Full-screen prize reveal overlay -->
  <div class="prize-reveal-overlay" id="prizeRevealOverlay" onclick="closePrizeReveal()">
    <div class="prize-reveal-inner">
      <div class="prize-reveal-congrats">🎉 ยินดีด้วย! 🎉</div>
      <img class="prize-reveal-img" id="prizeRevealImg" src="" alt="รางวัล">
      <div class="prize-reveal-name" id="prizeRevealName"></div>
      <div class="prize-reveal-value" id="prizeRevealValue"></div>
      <div class="prize-reveal-hint" id="prizeRevealHint">แตะเพื่อปิด</div>
    </div>
  </div>

  <script>
    const INTERVAL_MS = 5 * 60 * 1000;
    let nextRefresh = Date.now() + INTERVAL_MS;

    // ── Countdown ──
    function updateCountdown() {
      const remaining = Math.max(0, Math.round((nextRefresh - Date.now()) / 1000));
      const m = String(Math.floor(remaining / 60)).padStart(2, '0');
      const s = String(remaining % 60).padStart(2, '0');
      document.getElementById('countdown').textContent = `รีเฟรชใน ${m}:${s}`;
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    // ── Data sources, each normalized to { gold:{buy,sell}, gold_bar:{buy,sell}, update_date, update_time } ──
    const OFFICIAL_URL = 'https://www.goldtraders.or.th/api/GoldPrices/Latest?readjson=false';
    const CHNWT_URL = 'https://api.chnwt.dev/thai-gold-api/latest';

    const proxy1 = (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u);
    const proxy2 = (u) => 'https://corsproxy.io/?' + encodeURIComponent(u);

    const fmt = (n) => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const ORNAMENT_BUY_DISCOUNT = 4500;

    function parseOfficial(d) {
      if (!d || !d.bL_BuyPrice) return null;
      const t = new Date(d.asTime);
      return {
        gold:     { buy: fmt(d.bL_BuyPrice - ORNAMENT_BUY_DISCOUNT), sell: fmt(d.bL_SellPrice) },
        gold_bar: { buy: fmt(d.bL_BuyPrice),                         sell: fmt(d.bL_SellPrice) },
        update_date: t.toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' }),
        update_time: 'เวลา ' + t.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.'
      };
    }

    function parseChnwt(d) {
      if (d?.status !== 'success' || !d.response?.price?.gold_bar?.buy) return null;
      const { price, update_date, update_time } = d.response;
      const barBuy = Number(String(price.gold_bar.buy).replace(/,/g, ''));
      return {
        gold:     { buy: fmt(barBuy - ORNAMENT_BUY_DISCOUNT), sell: price.gold_bar.sell },
        gold_bar: price.gold_bar,
        update_date, update_time
      };
    }

    const SOURCES = [
      { url: proxy1(OFFICIAL_URL), parse: parseOfficial },
      { url: proxy2(OFFICIAL_URL), parse: parseOfficial },
      { url: OFFICIAL_URL,         parse: parseOfficial },
      { url: CHNWT_URL,            parse: parseChnwt },
      { url: proxy1(CHNWT_URL),    parse: parseChnwt },
      { url: proxy2(CHNWT_URL),    parse: parseChnwt }
    ];

    async function fetchWithFallback() {
      for (const src of SOURCES) {
        try {
          const res = await fetch(src.url, { cache: 'no-store' });
          const data = await res.json();
          const parsed = src.parse(data);
          if (parsed) return parsed;
        } catch (e) { continue; }
      }
      throw new Error('No source returned prices');
    }

    // ── Fetch prices ──
    async function fetchPrices() {
      const dot  = document.getElementById('live-dot');
      const info = document.getElementById('update-info');

      try {
        const { gold, gold_bar, update_date, update_time } = await fetchWithFallback();

        const set = (id, val) => {
          const el = document.getElementById(id);
          if (!el) return;
          el.textContent = val;
          el.classList.add('flash');
          el.addEventListener('animationend', () => el.classList.remove('flash'), { once: true });
        };

        set('gold-buy',  gold.buy);
        set('gold-sell', gold.sell);
        set('bar-buy',   gold_bar.buy);
        set('bar-sell',  gold_bar.sell);

        dot.className = 'live-dot';
        info.textContent = `ข้อมูลล่าสุด ${update_date} ${update_time}`;

      } catch (err) {
        dot.className = 'live-dot error';
        info.textContent = 'รอราคาอัปเดตจากตลาด — กำลังลองใหม่...';
      }

      nextRefresh = Date.now() + INTERVAL_MS;
    }

    fetchPrices();
    setInterval(fetchPrices, INTERVAL_MS);

    // ── Image slideshow ──
    const SLIDE_COUNT = 65;
    const SLIDE_INTERVAL_MS = 5000;
    let slideIndex = 1;
    const slideImg = document.getElementById('slideImg');

    function nextSlide() {
      slideImg.style.opacity = 0;
      setTimeout(() => {
        slideIndex = (slideIndex % SLIDE_COUNT) + 1;
        slideImg.src = `slide-${slideIndex}.jpg`;
        slideImg.style.opacity = 1;
      }, 800);
    }
    setInterval(nextSlide, SLIDE_INTERVAL_MS);

    // ── Spinning Wheel Mini-game ──
    // blank:true = ช่องว่าง | weight = โอกาสถูกเลือก (0 = ไม่มีโอกาส)
    // ชาม 70% | ร่ม 10% | แก้วเก็บความเย็น 10% | เก้าอี้ 5% | พัดลมเทอร์โบ 5%
    const PRIZES = [
      { name: 'ช่องว่าง',               points: '',               img: '',             color: '#444',    blank: true, weight: 0 },
      { name: 'iPhone 17 Pro',          points: '1,250 คะแนน',   img: 'prize-1.jpg',  color: '#e74c3c', weight: 0 },
      { name: 'JBL Go 4',               points: '40 คะแนน',      img: 'prize-2.jpg',  color: '#3498db', weight: 0 },
      { name: 'TV Samsung 55"',         points: '275 คะแนน',     img: 'prize-3.jpg',  color: '#27ae60', weight: 0 },
      { name: 'ชามซูโทเปีย',            points: 'มูลค่า 199 บาท', img: 'prize-4.jpg',  color: '#f39c12', weight: 70/3 },
      { name: 'ชามมินนี้มิกกี้',         points: 'มูลค่า 199 บาท', img: 'prize-5.jpg',  color: '#9b59b6', weight: 70/3 },
      { name: 'ชามสนูปปี้',             points: 'มูลค่า 199 บาท', img: 'prize-6.jpg',  color: '#e91e63', weight: 70/3 },
      { name: 'ช่องว่าง',               points: '',               img: '',             color: '#444',    blank: true, weight: 0 },
      { name: 'พัดลม ฮาตาริ',           points: '25 คะแนน',      img: 'prize-7.jpg',  color: '#00897b', weight: 0 },
      { name: 'พัดลมเทอร์โบเจ็ท',       points: 'มูลค่า 990 บาท', img: 'prize-8.jpg',  color: '#1565c0', weight: 5 },
      { name: 'ร่มพับอัตโนมัติ',         points: 'มูลค่า 390 บาท', img: 'prize-9.jpg',  color: '#558b2f', weight: 10 },
      { name: 'เก้าอี้แคมปปิ้ง',        points: 'มูลค่า 390 บาท', img: 'prize-10.jpg', color: '#6d4c41', weight: 5 },
      { name: 'แก้วเก็บความเย็น',        points: 'มูลค่า 590 บาท', img: 'prize-11.jpg', color: '#1976d2', weight: 5 },
      { name: 'แก้วเก็บความเย็นหมาแมว',  points: 'มูลค่า 490 บาท', img: 'prize-12.jpg', color: '#d35400', weight: 5 },
    ];

    const PRIZE_INDICES = PRIZES.map((p, i) => (!p.blank && p.weight > 0) ? i : -1).filter(i => i >= 0);

    function weightedRandom() {
      const total = PRIZE_INDICES.reduce((sum, i) => sum + PRIZES[i].weight, 0);
      let r = Math.random() * total;
      for (const i of PRIZE_INDICES) {
        r -= PRIZES[i].weight;
        if (r <= 0) return i;
      }
      return PRIZE_INDICES[PRIZE_INDICES.length - 1];
    }

    // ── Web Audio (ไม่ใช้ไฟล์เพลง) ──
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTick(speed) {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.value = 280 + speed * 520;
        gain.gain.setValueAtTime(0.07 + speed * 0.09, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.045);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.045);
      } catch(e) {}
    }

    function playWin() {
      try {
        const ctx = getAudio();
        [[523,0.00,0.12],[659,0.09,0.13],[784,0.18,0.15],
         [784,0.30,0.10],[1047,0.38,0.24],[1047,0.44,0.12],[1319,0.54,0.40]]
        .forEach(([freq, t, dur]) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sine'; o.frequency.value = freq;
          g.gain.setValueAtTime(0, ctx.currentTime + t);
          g.gain.linearRampToValueAtTime(0.22, ctx.currentTime + t + 0.03);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + dur);
          o.connect(g); g.connect(ctx.destination);
          o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + dur + 0.05);
        });
        [261, 329, 392].forEach(freq => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'triangle'; o.frequency.value = freq;
          g.gain.setValueAtTime(0.09, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.1);
          o.connect(g); g.connect(ctx.destination);
          o.start(ctx.currentTime); o.stop(ctx.currentTime + 1.2);
        });
      } catch(e) {}
    }

    // ── Confetti ──
    function launchConfetti(container) {
      const target = container || document.querySelector('.game-panel');
      const colors = ['#f5c842','#e74c3c','#3498db','#2ecc71','#9b59b6','#ff9800','#fff'];
      const count = container ? 80 : 55;
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        const s = 5 + Math.random() * 8;
        el.style.cssText =
          `left:${2+Math.random()*96}%;width:${s}px;height:${s}px;` +
          `background:${colors[i % colors.length]};` +
          `border-radius:${Math.random() > 0.5 ? '50%' : '2px'};` +
          `animation-duration:${0.9+Math.random()*1.1}s;` +
          `animation-delay:${Math.random()*0.5}s`;
        target.appendChild(el);
        setTimeout(() => el.remove(), 2200);
      }
    }

    // ── Full-screen prize reveal ──
    let prizeRevealTimer    = null;
    let prizeRevealInterval = null;

    function openPrizeReveal(prize) {
      document.getElementById('prizeRevealImg').src            = prize.img;
      document.getElementById('prizeRevealName').textContent   = prize.name;
      document.getElementById('prizeRevealValue').textContent  = prize.points;
      const overlay = document.getElementById('prizeRevealOverlay');
      overlay.classList.add('open');
      launchConfetti(overlay);
      let secs = 15;
      const hint = document.getElementById('prizeRevealHint');
      hint.textContent = `แตะเพื่อปิด · ${secs}s`;
      clearInterval(prizeRevealInterval);
      prizeRevealInterval = setInterval(() => {
        secs--;
        if (hint) hint.textContent = secs > 0 ? `แตะเพื่อปิด · ${secs}s` : 'กำลังปิด...';
      }, 1000);
      clearTimeout(prizeRevealTimer);
      prizeRevealTimer = setTimeout(closePrizeReveal, 15000);
    }

    function closePrizeReveal() {
      clearTimeout(prizeRevealTimer);
      clearInterval(prizeRevealInterval);
      prizeRevealTimer = prizeRevealInterval = null;
      const hint = document.getElementById('prizeRevealHint');
      if (hint) hint.textContent = 'แตะเพื่อปิด';
      document.getElementById('prizeRevealOverlay').classList.remove('open');
    }

    // ── Spinning Wheel ──
    let wheelAngle = 0, isSpinning = false;
    let spinCount  = 0;

    function lightenColor(hex, amt) {
      let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      r = Math.min(255,r+amt); g = Math.min(255,g+amt); b = Math.min(255,b+amt);
      return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
    }

    function initCanvas() {
      const canvas = document.getElementById('wheelCanvas');
      const panel  = canvas.closest('.game-panel');
      const size   = Math.min(panel.clientWidth * 0.82, 260);
      const dpr    = window.devicePixelRatio || 1;
      canvas.width  = size * dpr;
      canvas.height = size * dpr;
      canvas.style.width  = size + 'px';
      canvas.style.height = size + 'px';
      canvas.getContext('2d').scale(dpr, dpr);
    }

    function drawWheel(glow) {
      const canvas = document.getElementById('wheelCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const W = canvas.width / dpr, H = canvas.height / dpr;
      if (W < 10) return;
      const cx = W/2, cy = H/2, r = W/2 - 4;
      const N = PRIZES.length, arc = (2*Math.PI)/N;
      ctx.clearRect(0, 0, W, H);
      if (glow) {
        ctx.save();
        ctx.shadowColor = '#f5c842'; ctx.shadowBlur = 22;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2*Math.PI);
        ctx.strokeStyle = '#f5c842'; ctx.lineWidth = 4; ctx.stroke();
        ctx.restore();
      }
      for (let i = 0; i < N; i++) {
        const sa = wheelAngle + i*arc, ea = sa + arc;
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,sa,ea); ctx.closePath();
        ctx.fillStyle = PRIZES[i].color; ctx.fill();
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+r*Math.cos(sa), cy+r*Math.sin(sa));
        ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.save();
        ctx.translate(cx,cy); ctx.rotate(sa + arc/2);
        ctx.textAlign = 'right';
        ctx.font = `bold ${Math.max(8, W*0.038)}px Sarabun,sans-serif`;
        ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 3;
        ctx.fillText(PRIZES[i].name, r-8, 4);
        ctx.restore();
      }
      ctx.save();
      for (let d = 0; d < 24; d++) {
        const a = (d/24)*2*Math.PI;
        ctx.beginPath(); ctx.arc(cx+(r+2)*Math.cos(a), cy+(r+2)*Math.sin(a), 2.5, 0, 2*Math.PI);
        ctx.fillStyle = d%2===0 ? '#f5c842' : '#fff'; ctx.fill();
      }
      ctx.restore();
      ctx.beginPath(); ctx.arc(cx, cy, W*0.085, 0, 2*Math.PI);
      const cap = ctx.createRadialGradient(cx-W*0.02, cy-W*0.02, 1, cx, cy, W*0.085);
      cap.addColorStop(0,'#fff8d0'); cap.addColorStop(1,'#c8961a');
      ctx.fillStyle = cap; ctx.fill();
      ctx.strokeStyle = '#7a5800'; ctx.lineWidth = 1.5; ctx.stroke();
    }

    function spinToIndex(targetIndex, onDone) {
      const N = PRIZES.length, arc = (2*Math.PI)/N;
      const targetAngle = -Math.PI/2 - targetIndex*arc - arc/2;
      const extraSpins  = (6 + Math.random()*5) * 2*Math.PI;
      const start = wheelAngle;
      const end   = targetAngle - (Math.floor((targetAngle-start)/(2*Math.PI))+1)*2*Math.PI - extraSpins;
      const duration = 4200 + Math.random()*1000;
      const t0 = performance.now();
      let lastSeg = -1;
      function easeOut(t) { return 1 - Math.pow(1-t, 4); }
      function frame(now) {
        const t = Math.min((now-t0)/duration, 1);
        wheelAngle = start + (end-start)*easeOut(t);
        const norm = (((-wheelAngle%(2*Math.PI))+(2*Math.PI))%(2*Math.PI));
        const seg  = Math.floor(norm/arc) % N;
        if (seg !== lastSeg) { lastSeg = seg; playTick(1-t); }
        drawWheel(false);
        if (t < 1) requestAnimationFrame(frame);
        else { wheelAngle = end; isSpinning = false; try { drawWheel(true); } catch(e) {} onDone(); }
      }
      requestAnimationFrame(frame);
    }

    function openGame() {
      spinCount = 0;
      document.getElementById('gameOverlay').classList.add('open');
      document.getElementById('prizeResult').classList.remove('show');
      const btn = document.getElementById('spinBtn');
      btn.textContent = 'หมุน!'; btn.disabled = false;
      requestAnimationFrame(() => { initCanvas(); drawWheel(false); });
    }

    function closeGame() {
      document.getElementById('gameOverlay').classList.remove('open');
    }

    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      spinCount++;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('prizeResult').classList.remove('show');
      let targetIndex;
      if (spinCount < 3) {
        const blanks = PRIZES.map((p,i) => p.blank ? i : -1).filter(i => i >= 0);
        targetIndex = blanks[Math.floor(Math.random() * blanks.length)];
      } else {
        targetIndex = weightedRandom();
      }
      spinToIndex(targetIndex, () => {
        if (PRIZES[targetIndex].blank) showNoWin();
        else showResult(targetIndex);
      });
    }

    function showNoWin() {
      const img = document.getElementById('prizeImg');
      img.style.display = 'none';
      const remaining = 3 - spinCount;
      document.getElementById('prizeResultName').textContent  = '😅 เกือบได้แล้ว!';
      document.getElementById('prizeResultPoints').textContent =
        remaining > 0 ? `อีก ${remaining} ครั้งมีสิทธิ์ลุ้นรางวัล!` : 'ลองอีกครั้ง!';
      document.getElementById('prizeResult').classList.add('show');
      const btn = document.getElementById('spinBtn');
      btn.textContent = 'หมุน!'; btn.disabled = false;
    }

    function showResult(index) {
      const prize = PRIZES[index];
      const img = document.getElementById('prizeImg');
      img.src = prize.img; img.style.display = '';
      document.getElementById('prizeResultName').textContent  = '🎉 ' + prize.name;
      document.getElementById('prizeResultPoints').textContent = prize.points || '';
      document.getElementById('prizeResult').classList.add('show');
      launchConfetti();
      playWin();
      const btn = document.getElementById('spinBtn');
      btn.textContent = 'เริ่มใหม่'; btn.disabled = false;
      setTimeout(() => openPrizeReveal(prize), 400);
    }

  </script>
</body>
